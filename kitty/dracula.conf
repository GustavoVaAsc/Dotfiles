# Dracula Theme for kitty
# Canonical Dracula palette from https://draculatheme.com/spec
# Sourced via canonical fallback values (network unavailable)

# --- Core colors ---
background #282a36
foreground #f8f8f2

# --- Cursor ---
cursor #f8f8f2
cursor_text_color #282a36

# --- Selection ---
selection_background #44475a
selection_foreground #f8f8f2

# --- Normal ANSI colors (color0..color7) ---
color0 #21222c   # black
color1 #ff5555   # red
color2 #50fa7b   # green
color3 #f1fa8c   # yellow
color4 #bd93f9   # blue (purple accent in Dracula)
color5 #ff79c6   # magenta
color6 #8be9fd   # cyan
color7 #f8f8f2   # white

# --- Bright ANSI colors (color8..color15) ---
color8  #6272a4   # bright black (comments)
color9  #ff6e6e   # bright red
color10 #69ff94   # bright green
color11 #ffffa5   # bright yellow
color12 #d6acff   # bright blue (bright purple)
color13 #ff92df   # bright magenta
color14 #a4ffff   # bright cyan
color15 #ffffff   # bright white

# --- Extended palette (used by some apps) ---
color16 #f1fa8c
color17 #ff79c6
