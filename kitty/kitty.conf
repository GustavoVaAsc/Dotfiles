# kitty main config
# COSMIC/Wayland-friendly defaults — intentionally leaves scrollback,
# mouse actions, and other advanced settings at kitty defaults.

include dracula.conf

# --- Font ---
# JetBrains Mono is the configured font. If it is not installed on the system,
# kitty will fall back to a generic monospace font automatically.
font_family JetBrains Mono
font_size 12.0

# --- Background opacity ---
background_opacity 0.88
background_blur 0
dynamic_background_opacity yes

# --- Tab bar (COSMIC-friendly) ---
# Note: hide_tab_bar_if_only_one was removed in kitty >= 0.24;
# tab bar is always shown in this version. Omitted to avoid a warning.
tab_bar_edge top
tab_bar_style powerline

# --- Cursor ---
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink yes
cursor_blink_interval 0.4
cursor_stop_blinking_after 3.0

# --- Window ---
window_padding_width 8
