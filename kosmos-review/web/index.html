<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Kosmos review</title>
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/app.css">
  <link rel="stylesheet" href="/styles/markdown.css">

  <script type="importmap" nonce="__CSP_NONCE__">
  {
    "imports": {
      "preact": "/vendor/preact/preact.module.js",
      "preact/hooks": "/vendor/preact/hooks.module.js",
      "htm": "/vendor/htm/htm.module.js",
      "markdown-it": "/vendor/markdown-it/markdown-it.esm.min.mjs",
      "highlight.js": "/vendor/highlight.js/highlight.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>The review page needs JavaScript.</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
